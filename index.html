<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Block Hopper</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b25;font-family:Arial,sans-serif}.BlockHopper{position:relative;width:100%;height:100%;min-height:260px;overflow:hidden;background:#7cc8f7;touch-action:manipulation;user-select:none}.BlockHopperCanvas{display:block;width:100%;height:100%}.BlockHopperHud{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;color:#fff;font-size:20px;font-weight:800;text-shadow:0 2px 3px #26384a}.BlockHopperMessage{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#fff;font-size:19px;font-weight:800;text-shadow:0 2px 4px #26384a;padding:18px;pointer-events:none}.BlockHopperRunDistance{font-size:30px;margin-bottom:8px}.BlockHopperNewBest{margin-bottom:8px;color:#fff2a6}#r{display:none}
</style>
</head>
<body>
<div class="BlockHopper" id="g"><canvas class="BlockHopperCanvas" id="c"></canvas><div class="BlockHopperHud"><span id="d">0m</span><span id="best"></span></div><div class="BlockHopperMessage" id="m">Press Space or click to jump, and hold to jump higher</div><div class="BlockHopperMessage" id="r"><div class="BlockHopperRunDistance" id="score"></div><div id="nb" style="display:none">New best!</div><div>Press Space or click to play again</div></div></div>
<script src="game.js"></script>
</body>
</html>
